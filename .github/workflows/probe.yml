name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -m 15 -D - -H "Referer: https://ththys.github.io/" "https://polling.finance.naver.com/api/realtime?query=SERVICE_ITEM:005930,000660%7CSERVICE_INDEX:KOSPI,KOSDAQ&_callback=cb" | iconv -f euc-kr -t utf-8 | python3 -c "
          import sys,re,json
          t=sys.stdin.read(); print(t.split('\r\n\r\n')[0]); b=t.split('\r\n\r\n',1)[1]
          j=json.loads(b[b.index('(')+1:b.rindex(')')])
          for a in j['result']['areas']:
            for d in a['datas']: print(a['name'], {k:d.get(k) for k in ('cd','nv','pcv','cv','cr','rf','ms')})
          "
