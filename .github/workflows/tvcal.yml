name: tvcal
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/tvcal.py
      - run: |
          git add cal/
          git diff --cached --quiet && exit 0
          git -c user.name=site-bot -c user.email=site-bot@users.noreply.github.com commit -m "Economic calendar"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
